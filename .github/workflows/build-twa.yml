name: Build HausaNovels WebView v2.1.7

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: webview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Remove legacy files left by previous repository uploads
        shell: bash
        run: python3 tools/prepare_clean_source.py

      - name: Validate seamless v2.1.7 source
        shell: bash
        run: python3 tools/verify_android_resources.py

      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          configured=0
          [[ -n "$KEYSTORE_BASE64" ]] && configured=$((configured + 1))
          [[ -n "$KEYSTORE_PASSWORD" ]] && configured=$((configured + 1))
          [[ -n "$KEY_ALIAS" ]] && configured=$((configured + 1))
          [[ -n "$KEY_PASSWORD" ]] && configured=$((configured + 1))

          if [[ "$configured" -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; only the debug APK will be produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$configured" -ne 4 ]]; then
            echo "All four signing secrets are required: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD." >&2
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          keytool -list \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null

          cat > key.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build clean debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify built APK package and launcher
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='ng.hausanovels.app'"
          printf '%s\n' "$BADGING" | grep -F "launchable-activity: name='ng.hausanovels.app.SplashActivity'"

      - name: Generate debug APK certificate fingerprint and asset links
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"

          CERTS="$($APKSIGNER verify --print-certs "$APK")"
          RAW_SHA="$(printf '%s\n' "$CERTS" | awk -F': ' 'tolower($1) ~ /certificate sha-256 digest/ {print $2; exit}')"
          test -n "$RAW_SHA"

          python3 - "$RAW_SHA" <<'PY'
          import json, pathlib, re, sys
          raw = re.sub(r'[^0-9A-Fa-f]', '', sys.argv[1]).upper()
          if len(raw) != 64:
              raise SystemExit(f"Unexpected SHA-256 certificate digest: {sys.argv[1]!r}")
          fingerprint = ':'.join(raw[i:i+2] for i in range(0, 64, 2))
          data = [{
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                  "namespace": "android_app",
                  "package_name": "ng.hausanovels.app",
                  "sha256_cert_fingerprints": [fingerprint],
              },
          }]
          pathlib.Path("assetlinks-debug.json").write_text(json.dumps(data, indent=2) + "\n")
          pathlib.Path("debug-sha256-fingerprint.txt").write_text(fingerprint + "\n")
          PY

          echo "### Debug APK certificate SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat debug-sha256-fingerprint.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "This fingerprint was read from the APK itself, not from a presumed debug-keystore path." >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Generate release APK certificate fingerprint and asset links
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"

          CERTS="$($APKSIGNER verify --print-certs "$APK")"
          RAW_SHA="$(printf '%s\n' "$CERTS" | awk -F': ' 'tolower($1) ~ /certificate sha-256 digest/ {print $2; exit}')"
          test -n "$RAW_SHA"

          python3 - "$RAW_SHA" <<'PY'
          import json, pathlib, re, sys
          raw = re.sub(r'[^0-9A-Fa-f]', '', sys.argv[1]).upper()
          if len(raw) != 64:
              raise SystemExit(f"Unexpected SHA-256 certificate digest: {sys.argv[1]!r}")
          fingerprint = ':'.join(raw[i:i+2] for i in range(0, 64, 2))
          data = [{
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                  "namespace": "android_app",
                  "package_name": "ng.hausanovels.app",
                  "sha256_cert_fingerprints": [fingerprint],
              },
          }]
          pathlib.Path("assetlinks-release-upload-key.json").write_text(json.dumps(data, indent=2) + "\n")
          pathlib.Path("release-upload-key-sha256-fingerprint.txt").write_text(fingerprint + "\n")
          PY

          echo "### Release APK certificate SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat release-upload-key-sha256-fingerprint.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "For a Play Store install, also use the Play App Signing SHA-256 from Play Console." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug build
        uses: actions/upload-artifact@v4
        with:
          name: hausanovels-webview-v2.1.7-debug
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            assetlinks-debug.json
            debug-sha256-fingerprint.txt

      - name: Upload signed release build
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hausanovels-webview-v2.1.7-release
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            assetlinks-release-upload-key.json
            release-upload-key-sha256-fingerprint.txt

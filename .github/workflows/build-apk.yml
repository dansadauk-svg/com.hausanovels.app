name: Build Signed Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Create signing files
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > hausanovels-release-key.jks
          cat > key.properties <<PROPS
          storeFile=../hausanovels-release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS
      - name: Build signed APK
        run: gradle :app:assembleRelease
      - name: Build signed AAB
        run: gradle :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: hausanovels-release-files
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

name: Build HausaNovels TWA v2.1.0

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: twa-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Generate debug certificate fingerprint and asset links
        shell: bash
        run: |
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          DEBUG_SHA=$(keytool -list -v -keystore "$DEBUG_KEYSTORE" -alias androiddebugkey -storepass android -keypass android | awk -F': ' '/SHA256:/{print $2; exit}')
          python3 - "$DEBUG_SHA" <<'PY'
          import json, pathlib, sys
          fingerprint = sys.argv[1].strip()
          data = [{
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                  "namespace": "android_app",
                  "package_name": "ng.hausanovels.app",
                  "sha256_cert_fingerprints": [fingerprint],
              },
          }]
          pathlib.Path("assetlinks-debug.json").write_text(json.dumps(data, indent=2) + "\n")
          pathlib.Path("debug-sha256-fingerprint.txt").write_text(fingerprint + "\n")
          PY
          echo "### Debug certificate SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat debug-sha256-fingerprint.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Add this fingerprint in WordPress only for direct debug testing." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            cat > key.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
            echo "Release signing secrets are not configured; only the debug APK will be produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Generate release certificate fingerprint and asset links
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          RELEASE_SHA=$(keytool -list -v -keystore release.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}')
          python3 - "$RELEASE_SHA" <<'PY'
          import json, pathlib, sys
          fingerprint = sys.argv[1].strip()
          data = [{
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                  "namespace": "android_app",
                  "package_name": "ng.hausanovels.app",
                  "sha256_cert_fingerprints": [fingerprint],
              },
          }]
          pathlib.Path("assetlinks-release-upload-key.json").write_text(json.dumps(data, indent=2) + "\n")
          pathlib.Path("release-upload-key-sha256-fingerprint.txt").write_text(fingerprint + "\n")
          PY
          echo "### Release upload-key SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat release-upload-key-sha256-fingerprint.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "For the Play Store build, also add the Play App Signing SHA-256 fingerprint from Play Console." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug build
        uses: actions/upload-artifact@v4
        with:
          name: hausanovels-twa-v2.1.0-debug
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            assetlinks-debug.json
            debug-sha256-fingerprint.txt

      - name: Upload signed release build
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hausanovels-twa-v2.1.0-release
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            assetlinks-release-upload-key.json
            release-upload-key-sha256-fingerprint.txt

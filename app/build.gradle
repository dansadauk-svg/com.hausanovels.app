plugins {
    id "com.android.application"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigning = keystorePropertiesFile.exists()

if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "ng.hausanovels.app"
    compileSdk 36

    defaultConfig {
        applicationId "ng.hausanovels.app"
        minSdk 23
        targetSdk 36
        versionCode 216
        versionName "2.1.6"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

dependencies {
}

// Safety net for repositories that were updated through GitHub's browser uploader.
// Files missing from a new ZIP are not automatically deleted from the repository,
// so remove known legacy WebView/splash resources before every Android build.
def legacySourceFiles = [
        "src/main/java/ng/hausanovels/app/MainActivity.java",
        "src/main/java/ng/hausanovels/app/HausaNovelsLauncherActivity.java",
        "src/main/java/ng/hausanovels/app/BrowserFallback.java",
        "src/main/java/ng/hausanovels/app/OAuthReturnActivity.java",
        "src/main/java/com/hausanovels/app/MainActivity.java",
        "src/main/java/com/hausanovels/app/HausaNovelsLauncherActivity.java",
        "src/main/res/layout/activity_main.xml",
        "src/main/res/drawable/progress_fill.xml",
        "src/main/res/drawable/progress_track.xml",
        "src/main/res/drawable/splash_gradient.xml",
        "src/main/res/drawable/splash_progress.xml",
        "src/main/res/drawable/splash_screen.xml",
        "src/main/res/xml/filepaths.xml",
        "src/main/res/xml/provider_paths.xml"
]
tasks.register("purgeLegacyHausaNovelsSources", Delete) {
    delete legacySourceFiles.collect { file(it) }
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn("purgeLegacyHausaNovelsSources")
}
